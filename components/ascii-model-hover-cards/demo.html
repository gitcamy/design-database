<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ascii-model-hover-cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  html, body { margin: 0; background: #0B0B0B; color: #fff; }
  main { max-width: 1240px; margin: 0 auto; padding: 64px 16px 96px; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
// The demo transpiles AsciiModelHoverCards.jsx in the browser so there is one
// source of truth. Serve the repo over http, a file:// open will fail on fetch.
import * as THREE from "three";

const src = await (await fetch("./AsciiModelHoverCards.jsx")).text();
const body = src
  .replace(/^import React[\s\S]*?from "react";\n/m, "")
  .replace(/^import \* as THREE from "three";\n/m, "")
  .replace("export default function", "function");
const code = Babel.transform(body, { presets: [["react", { runtime: "classic" }]] }).code;
const AsciiModelHoverCards = new Function(
  "React", "useEffect", "useRef", "useState", "THREE",
  code + "; return AsciiModelHoverCards;"
)(React, React.useEffect, React.useRef, React.useState, THREE);

const cards = [
  { tag: "Lab ✦ Awards", kicker: "Who takes the", headline: "Top\nPrize?", subline: "Megamind Labs 2027",
    cta: "Make your call", href: "#", model: "trophy", tint: "#C9C02E", restRotation: -0.3, scale: 1.3, offset: [0, -0.25] },
  { tag: "Markets ✦ Signals", kicker: "Will the index hit", headline: "10K", subline: "Before summer?",
    cta: "Get the app", href: "#", model: "coins", tint: "#4CC94A", scale: 1.3 },
  { tag: "Research ✦ Models", kicker: "What ships in", headline: "2027", subline: "Q3 roadmap?",
    cta: "Test your read", href: "#", model: "knot", tint: "#8A3DBE", scale: 1.2 },
];

// Keep `cards` stable between renders: each card's scene rebuilds when its object changes.
const css = document.createElement("style");
css.textContent = ".amhc-headline { white-space: pre-line; }";
document.head.appendChild(css);

ReactDOM.createRoot(document.getElementById("app")).render(
  React.createElement(AsciiModelHoverCards, { title: "Open questions", cards })
);
</script>
</body>
</html>
