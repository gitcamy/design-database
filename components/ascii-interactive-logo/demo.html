/**
 * AsciiInteractiveLogo
 *
 * Renders a wordmark (default: the Megamind Labs logo, as SVG paths) as a
 * fixed grid of monospaced glyphs on a <canvas>. Letterforms are readable
 * only through character density. The pointer acts as a soft point light:
 * cells inside `radius` snap to the darkest glyph, cells beyond fade toward
 * the faint end of the ramp.
 *
 * Pipeline
 *   1. Fill the wordmark's SVG paths black on white to an offscreen canvas
 *      at 2x.
 *   2. Average luminance per grid cell -> density in [0, 1]. Cached until
 *      resize or prop change.
 *   3. Per frame: index = round(density * (n-1) + shift), where shift is the
 *      radial light term. Draw the glyph from a pre-rendered atlas.
 *
 * Props
 *   shape       { width, height, paths }  wordmark to render;         MLWORDMARK
 *   phrase      string   accessible label for the wordmark            "Megamind Labs"
 *   ramp        string   glyphs, lightest -> darkest                  " .:;i/|+*#"
 *   radius      number   px; cells inside snap to darkest             40
 *   falloff     number   px; e-fold distance beyond radius            radius * 1.5
 *   bg          string   background colour                            "#F2F1EC"
 *   ink         string   glyph colour (single colour)                 "#6B7A6E"
 *   cellWidth   number   px                                           5
 *   cellHeight  number   px                                           8
 *   aspect      number   width / height of the footer                 3
 *   margin      number   fraction of width kept clear per side        0.08
 *   restLevel   number   0..1 light level with no pointer             0.38
 *   minLevel    number   0..1 light level infinitely far away         0.12
 *   className, style     passed to the wrapper <div>
 */

const DEFAULT_RAMP = " .:;i/|+*#";

// Smoothstep gate: 0 for halo cells (density <= 0.06), 1 for cells that are
// at least ~45% ink. Controls how much of the pointer's "snap" a cell receives.
function snapGate(d) {
  const t = Math.min(1, Math.max(0, (d - 0.06) / (0.45 - 0.06)));
  return t * t * (3 - 2 * t);
}

function AsciiInteractiveLogo({
  shape = MLWORDMARK,
  phrase = "Megamind Labs",
  ramp = DEFAULT_RAMP,
  radius = 40,
  falloff,
  bg = "#F2F1EC",
  ink = "#6B7A6E",
  cellWidth = 5,
  cellHeight = 8,
  aspect = 3,
  margin = 0.08,
  restLevel = 0.38,
  minLevel = 0.12,
  className,
  style,
}) {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const fall = falloff ?? radius * 1.5;

  useEffect(() => {
    const wrap = wrapRef.current;
    const canvas = canvasRef.current;
    if (!wrap || !canvas) return;
    const ctx = canvas.getContext("2d");
    const n = ramp.length;

    let W = 0, H = 0, cols = 0, rows = 0, offX = 0, offY = 0, dpr = 1;
    let density = null; // Float32Array, one entry per cell, 1 = solid ink
    let atlas = null;   // pre-rendered ramp glyphs, one tile per glyph
    let pointer = null; // { x, y } in grid space, or null
    let raf = 0;
    let disposed = false;

    function buildAtlas() {
      const cw = Math.ceil(cellWidth * dpr);
      const ch = Math.ceil(cellHeight * dpr);
      atlas = document.createElement("canvas");
      atlas.width = cw * n;
      atlas.height = ch;
      const a = atlas.getContext("2d");
      a.fillStyle = ink;
      a.textAlign = "center";
      a.textBaseline = "middle";
      a.font = `${cellHeight * 0.95 * dpr}px ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace`;
      for (let i = 0; i < n; i++) {
        a.fillText(ramp[i], i * cw + cw / 2, ch / 2 + ch * 0.04);
      }
    }

    function buildDensity() {
      const S = 2; // supersample factor for the source drawing
      const gw = cols * cellWidth;
      const gh = rows * cellHeight;
      const src = document.createElement("canvas");
      src.width = gw * S;
      src.height = gh * S;
      const s = src.getContext("2d");
      s.scale(S, S);
      s.fillStyle = "#fff";
      s.fillRect(0, 0, gw, gh);

      // Fit the wordmark: width within margins, height capped to the middle of the frame.
      const maxW = gw * (1 - 2 * margin);
      const maxH = gh * 0.6;
      const scale = Math.min(maxW / shape.width, maxH / shape.height);
      const ox = (gw - shape.width * scale) / 2;
      const oy = (gh - shape.height * scale) / 2;

      s.save();
      s.translate(ox, oy);
      s.scale(scale, scale);
      s.fillStyle = "#000";
      for (const p of shape.paths) {
        s.fill(new Path2D(p.d), p.evenodd ? "evenodd" : "nonzero");
      }
      s.restore();

      // Average luminance per cell -> density.
      const img = s.getImageData(0, 0, src.width, src.height).data;
      const stride = src.width;
      const pw = cellWidth * S;
      const ph = cellHeight * S;
      const inv = 1 / (pw * ph * 255);
      density = new Float32Array(cols * rows);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let sum = 0;
          const x0 = c * pw;
          const y0 = r * ph;
          for (let y = 0; y < ph; y++) {
            let p = ((y0 + y) * stride + x0) * 4;
            for (let x = 0; x < pw; x++, p += 4) sum += 255 - img[p];
          }
          density[r * cols + c] = sum * inv;
        }
      }
    }

    function layout() {
      const rect = wrap.getBoundingClientRect();
      W = Math.max(1, Math.floor(rect.width));
      H = Math.max(1, Math.floor(rect.height));
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = `${W}px`;
      canvas.style.height = `${H}px`;
      cols = Math.max(1, Math.floor(W / cellWidth));
      rows = Math.max(1, Math.floor(H / cellHeight));
      offX = (W - cols * cellWidth) / 2;
      offY = (H - rows * cellHeight) / 2;
      buildAtlas();
      buildDensity();
      draw();
    }

    function draw() {

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      const cw = Math.ceil(cellWidth * dpr);
      const ch = Math.ceil(cellHeight * dpr);

      const py = hasPointer ? pointer.y : 0;

      for (let r = 0; r < rows; r++) {

            } else {

            }

            // is gated by density so anti-aliased halos stay faint and letter

            // applies in full so extremities dissolve.

          if (idx <= 0) continue;
          ctx.drawImage(

            idx * cw, 0, cw, ch,
            offX + c * cellWidth, offY + r * cellHeight, cellWidth, cellHeight

        }
      }
    }

    function schedule() {

      raf = requestAnimationFrame(() => {
        raf = 0;
        draw();
      });
    }

    function onMove(e) {

      schedule();
    }

      schedule();
    }

    const ro = new ResizeObserver(layout);
    ro.observe(wrap);
    layout();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { if (!disposed) layout(); });
    }

    window.addEventListener("pointermove", onMove, { passive: true });
    window.addEventListener("pointerdown", onMove, { passive: true });
    document.documentElement.addEventListener("mouseleave", onLeave);
    window.addEventListener("blur", onLeave);

    return () => {
      disposed = true;
      if (raf) cancelAnimationFrame(raf);
      ro.disconnect();
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerdown", onMove);
      document.documentElement.removeEventListener("mouseleave", onLeave);
      window.removeEventListener("blur", onLeave);
    };
  }, [shape, ramp, radius, fall, bg, ink, cellWidth, cellHeight, margin, restLevel, minLevel]);

  return (
    <div
      ref={wrapRef}
      className={className}
      style={{
        position: "relative",
        width: "100%",
        aspectRatio: `${aspect} / 1`,
        background: bg,
        overflow: "hidden",
        ...style,
      }}
      role="img"
      aria-label={phrase}
    >
      <canvas ref={canvasRef} style={{ display: "block", position: "absolute", inset: 0 }} />
    </div>
  );
}

</script>
