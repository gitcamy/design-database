<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>lens-part-cta-reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; background: #F4EFE6; font: 400 16px/1.5 Inter, "Helvetica Neue", Arial, sans-serif; color: #2A2622; }
  /* Stand-in for the page above: a warm neutral section so the violet enters from below. */
  .above { min-height: 120vh; display: grid; place-items: center; padding: 0 20px; text-align: center; }
  .above h1 { font: 400 clamp(32px, 4vw, 56px)/1.05 Newsreader, Georgia, serif; margin: 0 0 12px; letter-spacing: -0.02em; }
  .above p { margin: 0 auto; max-width: 32em; color: #6B645C; }
  .bar {
    position: fixed; z-index: 60; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 8px; font: 11px/1 "SF Mono", ui-monospace, Menlo, monospace;
  }
  .bar button {
    font: inherit; text-transform: uppercase; letter-spacing: 0.12em; padding: 9px 14px;
    border-radius: 999px; border: 1px solid #1E1E1C22; background: #fff; color: #1E1E1C; cursor: pointer;
  }
</style>
</head>
<body>
<section class="above">
  <div>
    <h1>Scroll down slowly.</h1>
    <p>Placeholder section. The violet block below opens like a lens as it reaches the top of the viewport, and scrubs back closed when you scroll up.</p>
  </div>
</section>
<div id="cta"></div>
<div class="bar"><button id="theme">Palette: violet</button></div>
<script>
// The demo transpiles LensPartReveal.jsx in the browser so there is one source
// of truth. Serve this folder over http, a file:// open will fail on fetch.
(async () => {
  const src = await (await fetch("./LensPartReveal.jsx")).text();
  const body = src
    .replace(/^import[\s\S]*?from "react";\n/m, "")
    .replace("export default function", "function");
  const code = Babel.transform(body, { presets: ["react"] }).code;
  const LensPartReveal = new Function(
    "React", "useEffect", "useLayoutEffect", "useRef",
    code + "; return LensPartReveal;"
  )(React, React.useEffect, React.useLayoutEffect, React.useRef);

  const themes = [
    { name: "violet" },
    { name: "sage", bg: "#8FB39A", deep: "#7FA58B", side: "#B3CDBA", lobe: "#A9C6B1", rim: "#C6DCCB", shade: "rgba(40, 90, 60, 0.22)" },
    { name: "ember", bg: "#E58A67", deep: "#DC7955", side: "#F2B39A", lobe: "#EFA487", rim: "#F7C3AE", shade: "rgba(150, 60, 30, 0.22)" },
  ];
  let t = 0;
  const root = ReactDOM.createRoot(document.getElementById("cta"));
  const render = () => {
    const { name, ...props } = themes[t];
    document.getElementById("theme").textContent = "Palette: " + name;
    root.render(React.createElement(LensPartReveal, props));
  };
  document.getElementById("theme").onclick = () => { t = (t + 1) % themes.length; render(); };
  render();
})();
</script>
</body>
</html>
