<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>negative-space-mark-footer</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; background: #fff; }
  .page { min-height: 40vh; display: grid; place-items: center;
          font: 13px/1.5 "SF Mono", ui-monospace, Menlo, monospace; color: #888; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="page">PAGE CONTENT ABOVE THE FOOTER</div>
<div id="root"></div>
<script>
// Transpiles the component in the browser so there is one source of truth.
// Serve this folder over http; a file:// open will fail on fetch.
(async () => {
  const src = await (await fetch("./NegativeSpaceMarkFooter.jsx?v=" + Date.now())).text();
  const body = src
    .replace(/^import[\s\S]*?from "react";\n/m, "")
    .replace("export default function", "function");
  const code = Babel.transform(body, { presets: ["react"] }).code;
  // Hooks come from the stripped import, so bind them from React first.
  const prelude = "const { useState, useEffect, useRef, useMemo, useCallback } = React;\n";
  const Footer = new Function("React", prelude + code + "; return NegativeSpaceMarkFooter;")(React);
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Footer));
})();
</script>
</body>
</html>
